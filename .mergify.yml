commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

merge_queue:
  mode: serial
  max_parallel_checks: 1
  queue_controls_comment: false

scopes:
  source:
    files:
      lane:
        include:
          - lane/**
  barrier_files:
    include:
      - barrier/**

queue_rules:
  - name: vm6-workflow-toctou-261009
    batch_size: 1
    queue_conditions:
      - base = main
      - title ~= ^VM6_WORKFLOW_TOCTOU_261009
      - -files ~= ^\.github/workflows/
      - check-success = @github-actions/ff-ci
    merge_conditions: []
    max_checks_retries: 0
    merge_method: merge
    update_method: merge
    checks_timeout: null
